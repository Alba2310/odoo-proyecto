<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" font-family="'Segoe UI', system-ui, sans-serif">
  <title>Estados del vehículo</title>
  <defs>
    <marker id="flecha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#898781"/>
    </marker>
  </defs>
  <rect width="1200" height="560" fill="#ffffff"/>

  <text x="40" y="70" font-size="32" font-weight="600" fill="#0b0b0b">Estados del vehículo</text>
  <text x="40" y="106" font-size="19" fill="#52514e">El sistema cambia el estado solo, según lo que pasa con el auto</text>

  <!-- fila de arriba: el camino comercial -->
  <g fill="#ffffff" stroke="#c3c2b7" stroke-width="1.5">
    <rect x="90" y="170" width="240" height="90" rx="12"/>
    <rect x="480" y="170" width="240" height="90" rx="12"/>
    <rect x="870" y="170" width="240" height="90" rx="12"/>
    <rect x="450" y="410" width="300" height="90" rx="12"/>
  </g>
  <circle cx="148" cy="215" r="9" fill="#0ca30c"/>
  <text x="168" y="223" font-size="23" font-weight="600" fill="#0b0b0b">Disponible</text>
  <circle cx="542" cy="215" r="9" fill="#2a78d6"/>
  <text x="562" y="223" font-size="23" font-weight="600" fill="#0b0b0b">Reservado</text>
  <circle cx="943" cy="215" r="9" fill="#52514e"/>
  <text x="963" y="223" font-size="23" font-weight="600" fill="#0b0b0b">Vendido</text>
  <circle cx="494" cy="455" r="9" fill="#eb6834"/>
  <text x="514" y="463" font-size="23" font-weight="600" fill="#0b0b0b">En mantenimiento</text>

  <g stroke="#898781" stroke-width="2" marker-end="url(#flecha)">
    <line x1="334" y1="215" x2="476" y2="215"/>
    <line x1="724" y1="215" x2="866" y2="215"/>
  </g>
  <g font-size="16" fill="#52514e" text-anchor="middle">
    <text x="405" y="244">se reserva</text>
    <text x="795" y="244">se confirma</text>
    <text x="795" y="263">la venta</text>
  </g>

  <!-- taller: desde cualquier estado de arriba -->
  <g stroke="#c3c2b7" stroke-width="2" fill="none">
    <path d="M210 260 V320 H990 V260"/>
    <line x1="600" y1="260" x2="600" y2="320"/>
  </g>
  <g stroke="#898781" stroke-width="2">
    <line x1="570" y1="322" x2="570" y2="404" marker-end="url(#flecha)"/>
    <line x1="630" y1="408" x2="630" y2="326" marker-end="url(#flecha)"/>
  </g>
  <text x="554" y="368" font-size="16" fill="#52514e" text-anchor="end">entra al taller</text>
  <text x="646" y="358" font-size="16" fill="#52514e">sale del taller y vuelve</text>
  <text x="646" y="378" font-size="16" fill="#52514e">a su estado anterior</text>
</svg>
