# Servidor del sitio web de venta (servicio "sitio" de docker-compose.yml)
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Redirecciones relativas: /llamar pasa a /llamar/ sin perder el puerto 5500 de la dirección.
    absolute_redirect off;

    location / {
        try_files $uri $uri/ =404;
    }
}
