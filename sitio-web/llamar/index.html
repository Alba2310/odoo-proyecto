<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Llamar a AutoFlow</title>
  <meta name="description" content="Teléfono y WhatsApp de ventas de AutoFlow, el sistema para concesionarias y talleres en Odoo 18.">
  <meta name="theme-color" content="#0B1A3D">
  <link rel="icon" href="../img/logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/estilos.css">
  <script>document.documentElement.classList.add('js')</script>
  <script src="../js/main.js" defer></script>
</head>
<body>
  <main class="llamar">
    <div class="llamar__tarjeta">
      <a class="marca" href="../index.html" aria-label="AutoFlow, inicio"><img src="../img/logo.svg" alt="" width="38" height="38"><span>AutoFlow</span></a>
      <p class="llamar__etiqueta">Ventas y demostraciones</p>
      <a class="llamar__numero" href="../contacto.html" data-contacto="llamada" data-texto="telefono">+595 982 600 740</a>

      <div class="llamar__botones">
        <a class="btn btn--naranja btn--grande btn--bloque" href="../contacto.html" data-contacto="llamada"><svg class="ico" aria-hidden="true"><use href="#i-telefono"></use></svg> Llamar ahora</a>
        <a class="btn btn--wa btn--grande btn--bloque" href="../contacto.html" data-contacto="whatsapp"><svg class="ico" aria-hidden="true"><use href="#i-whatsapp"></use></svg> Escribir por WhatsApp</a>
        <button class="btn btn--fantasma btn--grande btn--bloque" type="button" data-copiar="telefono"><svg class="ico" aria-hidden="true"><use href="#i-copiar"></use></svg> Copiar número</button>
      </div>

      <p class="llamar__ayuda solo-mouse">Desde la computadora, copiá el número o escribinos por WhatsApp Web.</p>
      <p class="llamar__horario">Lunes a viernes 08:00 – 18:00<br>Sábados 08:00 – 12:00</p>
      <a class="enlace-flecha" href="../index.html">Conocé AutoFlow <svg class="ico" aria-hidden="true"><use href="#i-flecha"></use></svg></a>
    </div>
  </main>
</body>
</html>
